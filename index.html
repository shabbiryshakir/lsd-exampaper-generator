    <style>
      /* Splash shown instantly while the app loads */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f3f4f6; font-family: system-ui, sans-serif; color: #4338ca; }
      .boot img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(67,56,202,.25); }
      .boot b { font-size: 18px; }
      .boot i { width: 36px; height: 36px; border: 4px solid #c7d2fe; border-top-color: #4338ca; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

    <div id="root"><div class="boot"><img src="/pwa-192.png" alt="" /><b style="font-family:Georgia,serif;font-size:26px">LSD</b><span style="font-size:13px;color:#6b7280">Teacher Tools</span><i></i></div></div>
